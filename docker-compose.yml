services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_USER: myles, POSTGRES_PASSWORD: myles, POSTGRES_DB: myles }
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U myles"], interval: 5s, timeout: 3s, retries: 10 }
  redis:
    image: redis:7
    ports: ["6379:6379"]
  api:
    build: .
    command: uvicorn myles.api.app:app --host 0.0.0.0 --port 8000
    environment: { DATABASE_URL: postgresql://myles:myles@postgres:5432/myles, REDIS_URL: redis://redis:6379/0, MYLES_PROVIDER: fixture }
    ports: ["8000:8000"]
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_started } }
  web:
    build: ./web
    ports: ["3000:3000"]
    environment: { NEXT_PUBLIC_API_URL: http://localhost:8000 }
    depends_on: [api]
volumes: { pgdata: {} }
